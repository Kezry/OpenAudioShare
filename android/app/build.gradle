plugins {
    id 'com.android.application'
}

// Release signing material lives outside the repo: keystore.properties locally
// (gitignored) or environment variables in CI. Without it, releases fall back
// to the debug key so local builds still work.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseStoreFile = keystoreProps.getProperty("storeFile") ?: System.getenv("SIGNING_STORE_FILE")
def releaseStorePassword = keystoreProps.getProperty("storePassword") ?: System.getenv("SIGNING_STORE_PASSWORD")
def releaseKeyAlias = keystoreProps.getProperty("keyAlias") ?: System.getenv("SIGNING_KEY_ALIAS")
def releaseKeyPassword = keystoreProps.getProperty("keyPassword") ?: System.getenv("SIGNING_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile != null && releaseStorePassword != null \
        && releaseKeyAlias != null && releaseKeyPassword != null \
        && file(releaseStoreFile).exists()

android {
    namespace 'com.picapico.audioshare'
    compileSdk 35

    defaultConfig {
        applicationId "com.picapico.audioshare"
        minSdk 21
        targetSdk 35
        versionCode 204
        versionName "2.0.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    flavorDimensions "abi"
    productFlavors {
        arm32 {
            dimension "abi"
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters "armeabi-v7a"
            }
        }
        arm64 {
            dimension "abi"
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters "arm64-v8a"
            }
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'com.github.HeHang0:exoplayer-extension-flac:1.3.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.koushikdutta.async:androidasync:3.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}