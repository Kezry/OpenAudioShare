name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Musiche Web
        run: |
          cd musiche/web
          yarn install
          yarn build-only

      - name: Copy Web Assets
        run: |
          copy musiche\web\dist android\app\src\main\assets -Recurse

      - name: Create FodyWeavers.xml
        run: |
          cd windows
          echo "<Weavers><Costura/></Weavers>" > FodyWeavers.xml

      - name: Build Windows (.NET Framework 4.6.2)
        run: |
          cd windows
          msbuild AudioShare.sln -t:"Restore;Build" /p:Configuration=Release /p:Platform="Any CPU" /p:TargetFramework=net462

      - name: Build Android APK
        run: |
          cd android
          .\gradlew.bat assembleRelease

      - name: Prepare Release Files
        run: |
          mkdir release
          # Windows files
          copy windows\bin\Release\net462\AudioShare.exe release\AudioShare.exe
          # Android file
          copy android\app\build\outputs\apk\release\app-release.apk release\AudioShare.apk

      - name: Download Platform Tools
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile platform-tools.zip
          Expand-Archive -Path .\platform-tools.zip -DestinationPath platform-tools
          copy platform-tools\platform-tools\adb.exe release\adb.exe
          copy platform-tools\platform-tools\AdbWinApi.dll release\AdbWinApi.dll
          copy platform-tools\platform-tools\AdbWinUsbApi.dll release\AdbWinUsbApi.dll

      - name: Generate Release Notes
        id: release_notes
        run: |
          $version = "${{ github.ref_name }}" -replace 'v', ''
          @"
          ## AudioShare v$version

          ### 新增功能
          - **一键连接/断开**: 同时连接或断开所有设备
          - **自动连接**: 开启后启动软件自动连接已保存设备
          - **延迟显示**: Windows 设备列表显示连接延迟和质量指示灯
          - **同步延迟显示**: Android 端显示同步延迟信息

          ### 同步优化
          - **实时延迟调整**: SetDelay 命令可在播放过程中动态生效，修复长时间播放后设备间音频漂移
          - **RTT 平滑**: 使用指数移动平均滤波网络延迟测量，减少抖动
          - **更快同步周期**: 同步检测间隔从 30 秒缩短至 15 秒
          - **延迟变化滞后**: 仅当延迟差超过 5ms 时才发送调整命令，避免频繁抖动
          - **缓冲区漂移监控**: 自动检测并修正长时间播放中的缓冲区积累

          ### 性能优化
          - **低延迟音频**: Android 使用 AAudio 快速音频路径 (API 24+)
          - **直接音频写入**: 移除线程切换，降低音频延迟
          - **连接稳定性**: 断开后保留地址可重连，改善断开检测
          - **多设备同步**: 通过控制通道测量 RTT，自动补偿延迟

          ### 下载说明
          - **AudioShare.exe**: Windows 版本（需要 .NET Framework 4.6.2+，Win10/11 自带）
          - **AudioShare.apk**: Android 安装包（需要 Android 5.0+）
          - **adb.exe**: ADB 工具（USB 连接需要，可选）

          ### 系统要求
          - Windows 10/11
          - Android 5.0+
          - 同一局域网（Wi-Fi）或 USB 数据线连接

          ---
          [项目主页](https://github.com/Kezry/OpenAudioShare)
          "@ | Out-File -FilePath release_notes.md -Encoding UTF8

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            release/AudioShare.exe
            release/AudioShare.apk
            release/adb.exe
            release/AdbWinApi.dll
            release/AdbWinUsbApi.dll
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
