name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Version Consistency
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $csprojVersion = (Select-String -Path windows/AudioShare.csproj -Pattern '<Version>(.*?)</Version>' | Select-Object -First 1).Matches.Groups[1].Value
          $gradle = Get-Content android/app/build.gradle -Raw
          $versionName = [regex]::Match($gradle, 'versionName "([^"]+)"').Groups[1].Value
          $versionCode = [regex]::Match($gradle, 'versionCode (\d+)').Groups[1].Value
          if ($csprojVersion -ne $tag) { throw "Tag v$tag does not match windows csproj version $csprojVersion" }
          if ($versionName -ne $tag) { throw "Tag v$tag does not match android versionName $versionName" }
          $expectedCode = [int]($tag -replace '\.', '')
          if ([int]$versionCode -ne $expectedCode) { throw "versionCode $versionCode does not match expected $expectedCode for $tag" }
          Write-Host "Version check OK: v$tag (versionCode $versionCode)"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle caching is handled by setup-gradle itself; a second actions/cache
      # on the same paths caused save/restore conflicts.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Android Signing Key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if (-not $env:SIGNING_KEYSTORE_B64) {
            throw "Secret SIGNING_KEYSTORE_B64 is not configured; refusing to publish a debug-signed APK."
          }
          $dir = "$env:RUNNER_TEMP\signing"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [IO.File]::WriteAllBytes("$dir\sign.jks", [Convert]::FromBase64String($env:SIGNING_KEYSTORE_B64))
          "SIGNING_STORE_FILE=$dir\sign.jks" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNING_STORE_PASSWORD=$env:SIGNING_STORE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNING_KEY_ALIAS=$env:SIGNING_KEY_ALIAS" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNING_KEY_PASSWORD=$env:SIGNING_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Musiche Web
        run: |
          cd musiche/web
          yarn install
          yarn build-only

      - name: Copy Web Assets
        run: |
          copy musiche\web\dist android\app\src\main\assets -Recurse

      - name: Build Windows (.NET Framework 4.6.2)
        run: |
          cd windows
          msbuild AudioShare.sln -t:"Restore;Build" /p:Configuration=Release /p:Platform="Any CPU" /p:TargetFramework=net462

      - name: Build Android APK
        run: |
          cd android
          .\gradlew.bat assembleRelease

      - name: Prepare Release Files
        run: |
          mkdir release
          # Windows files
          copy windows\bin\Release\net462\AudioShare.exe release\AudioShare.exe
          # Android 32-bit
          copy android\app\build\outputs\apk\arm32\release\app-arm32-release.apk release\AudioShare.apk
          # Android 64-bit
          copy android\app\build\outputs\apk\arm64\release\app-arm64-release.apk release\AudioShare_arm64.apk

      - name: Download Platform Tools
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile platform-tools.zip
          Expand-Archive -Path .\platform-tools.zip -DestinationPath platform-tools
          copy platform-tools\platform-tools\adb.exe release\adb.exe
          copy platform-tools\platform-tools\AdbWinApi.dll release\AdbWinApi.dll
          copy platform-tools\platform-tools\AdbWinUsbApi.dll release\AdbWinUsbApi.dll

      - name: Generate Release Notes
        id: release_notes
        run: |
          $tag = "${{ github.ref_name }}"
          $tags = @(git tag --sort=-creatordate | Where-Object { $_ -ne $tag })
          $prevTag = if ($tags.Count -gt 0) { $tags[0] } else { $null }
          if ($prevTag) {
            $commits = @(git log --pretty=format:"- %s" "$prevTag..$tag" | Where-Object { $_ -match '\S' })
            $range = "$prevTag -> $tag"
          } else {
            $commits = @(git log --pretty=format:"- %s" -20 | Where-Object { $_ -match '\S' })
            $range = $tag
          }
          $changelog = ($commits -join "`n")
          @"
          ## AudioShare $tag

          $range

          ### 本次更新

          $changelog

          ### 下载说明
          - **AudioShare.exe**: Windows 版本（需要 .NET Framework 4.6.2+，Win10/11 自带）
          - **AudioShare.apk**: Android 32位安装包（需要 Android 5.0+）
          - **AudioShare_arm64.apk**: Android 64位安装包（推荐新设备使用）
          - **adb.exe**: ADB 工具（USB 连接需要，可选）

          ### 系统要求
          - Windows 10/11
          - Android 5.0+
          - 同一局域网（Wi-Fi）或 USB 数据线连接

          ---
          [项目主页](https://github.com/Kezry/OpenAudioShare)
          "@ | Out-File -FilePath release_notes.md -Encoding UTF8

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            release/AudioShare.exe
            release/AudioShare.apk
            release/AudioShare_arm64.apk
            release/adb.exe
            release/AdbWinApi.dll
            release/AdbWinUsbApi.dll
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
