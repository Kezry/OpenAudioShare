name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Musiche Web
        run: |
          cd musiche/web
          yarn install --frozen-lockfile
          yarn build-only

      - name: Copy Web Assets
        run: |
          copy musiche\web\dist android\app\src\main\assets -Recurse

      - name: Build Windows (.NET Framework 4.6.2)
        run: |
          cd windows
          msbuild AudioShare.sln -t:"Restore;Build" /p:Configuration=Release /p:Platform="Any CPU" /p:TargetFramework=net462

      - name: Restore Android Signing Key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if (-not $env:SIGNING_KEYSTORE_B64) {
            Write-Warning "Secret SIGNING_KEYSTORE_B64 not configured; APKs will be debug-signed."
          } else {
            $dir = "$env:RUNNER_TEMP\signing"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            [IO.File]::WriteAllBytes("$dir\sign.jks", [Convert]::FromBase64String($env:SIGNING_KEYSTORE_B64))
            "SIGNING_STORE_FILE=$dir\sign.jks" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "SIGNING_STORE_PASSWORD=$env:SIGNING_STORE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "SIGNING_KEY_ALIAS=$env:SIGNING_KEY_ALIAS" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "SIGNING_KEY_PASSWORD=$env:SIGNING_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Build Android APK
        run: |
          cd android
          .\gradlew.bat assembleRelease

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioShare-build
          path: |
            windows/bin/Release/net462/AudioShare.exe
            android/app/build/outputs/apk/arm32/release/app-arm32-release.apk
            android/app/build/outputs/apk/arm64/release/app-arm64-release.apk
          if-no-files-found: error
